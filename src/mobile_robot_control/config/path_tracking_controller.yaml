path_tracking_controller:
  ros__parameters:
    use_sim_time: true

    odom_topic: "odom"
    cmd_vel_topic: "cmd_vel"

    linear_gain: 0.8
    angular_gain: 2.0

    max_linear_velocity: 0.4
    max_angular_velocity: 1.5
    max_heading_error_for_translation: 1.0

    waypoint_acceptance_radius: 0.15
    odometry_timeout: 0.5

    waypoints:
      - 0.0
      - 0.0
      - 1.0
      - 0.0
      - 1.0
      - 1.0
